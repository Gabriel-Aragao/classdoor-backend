name: Deploy to VPS

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Deploy and Restart Production (Main)
        if: github.ref == 'refs/heads/main'
        run: |
          # Como a pasta /opt/classdoor pertence ao usuario classdoor-app, copiamos direto
          cp target/*.jar /opt/classdoor/bin/backend.jar
          # Reiniciamos o servico usando o sudo configurado sem senha para o systemctl
          sudo systemctl restart classdoor-prod

      - name: Deploy and Restart Development (Dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          cp target/*.jar /opt/classdoor/bin/backend-dev.jar
          sudo systemctl restart classdoor-dev
